<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Donor Darah - Desktop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #dc3545;
            --secondary: #6c757d;
            --light: #f8f9fa;
            --dark: #343a40;
        }
        
        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .banner-container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 53, 69, 0.2);
            overflow: hidden;
            border: 3px solid var(--primary);
        }
        
        .banner-content {
            display: flex;
            align-items: center;
            padding: 40px 60px;
        }
        
        .banner-left {
            flex: 1;
            padding-right: 40px;
        }
        
        .banner-icon {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .icon-circle {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .banner-headline {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .banner-subhead {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 30px;
            font-weight: 400;
        }
        
        .banner-features {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .feature-icon {
            color: var(--primary);
            font-size: 1.5rem;
        }
        
        .feature-text {
            font-weight: 600;
            color: var(--dark);
        }
        
        .cta-button {
            background: linear-gradient(135deg, var(--primary) 0%, #a71d2a 100%);
            color: white;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.5);
            color: white;
        }
        
        .banner-right {
            flex: 0 0 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .banner-illustration {
            position: relative;
            width: 350px;
            height: 350px;
        }
        
        .blood-drop {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--primary);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            top: 50%;
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
            box-shadow: 0 10px 30px rgba(220, 53, 69, 0.4);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: rotate(-45deg) translateY(0);
            }
            50% {
                transform: rotate(-45deg) translateY(-10px);
            }
        }
        
        .heart-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: white;
            z-index: 1;
        }
        
        .info-section {
            background: var(--primary);
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .info-text {
            font-size: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="banner-content">
            <div class="banner-left">
                <div class="banner-icon">
                    <div class="icon-circle">
                        <i class="fas fa-tint"></i>
                    </div>
                    <div class="icon-circle">
                        <i class="fas fa-heart"></i>
                    </div>
                </div>
                
                <h1 class="banner-headline">Donor Darah = E-Sertifikat + Goodie Bag</h1>
                
                <p class="banner-subhead">Setiap tetes berharga, setiap donor dapat apresiasi</p>
                
                <div class="banner-features">
                    <div class="feature-item">
                        <i class="fas fa-certificate feature-icon"></i>
                        <span class="feature-text">E-Sertifikat</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-gift feature-icon"></i>
                        <span class="feature-text">Goodie Bag</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-check-circle feature-icon"></i>
                        <span class="feature-text">Cepat & Aman</span>
                    </div>
                </div>
                
                <a href="#" class="cta-button">
                    <i class="fas fa-calendar-plus me-2"></i>Daftar Donor Sekarang
                </a>
            </div>
            
            <div class="banner-right">
                <div class="banner-illustration">
                    <div class="blood-drop"></div>
                    <i class="fas fa-heart heart-icon"></i>
                </div>
            </div>
        </div>
        
        <div class="info-section">
            <div class="info-item">
                <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="info-text">PMI Jakarta Pusat</div>
            </div>
            <div class="info-item">
                <div class="info-icon"><i class="fas fa-clock"></i></div>
                <div class="info-text">Senin - Jumat, 08:00 - 16:00</div>
            </div>
            <div class="info-item">
                <div class="info-icon"><i class="fas fa-phone"></i></div>
                <div class="info-text">0812-3456-7890</div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
